
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>06 - Crawling Cursor</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <!-- Crawling Cursor -->
    <script src="https://unpkg.com/aframe-crawling-cursor"></script>
</head>

<body>

<a-scene background="color: #20232a">

    <!-- Iluminação -->
    <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    <a-light type="directional" position="-2 4 3" intensity="1"></a-light>

    <!-- Chão -->
    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#30343b">
    </a-plane>

    <!-- Objetos interativos -->
    <a-box
        position="-2 1.5 -4"
        color="#4CC3D9"
        class="interativo">
    </a-box>

    <a-sphere
        position="0 1.5 -4"
        radius="0.8"
        color="#EF476F"
        class="interativo">
    </a-sphere>

    <a-cylinder
        position="2 1.5 -4"
        radius="0.6"
        height="1.5"
        color="#06D6A0"
        class="interativo">
    </a-cylinder>

    <!-- Câmara com Crawling Cursor -->
    <a-entity
        camera
        position="0 1.6 0"
        look-controls
        crawling-cursor="cursor: #my-cursor"
        raycaster="objects: .interativo">

        <a-entity
            id="my-cursor"
            cursor="rayOrigin: entity"
            geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
            material="color: white; shader: flat"
            position="0 0 -1">
        </a-entity>

    </a-entity>

</a-scene>

</body>
</html>
